[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-core"
version = "0.1.0"
description = "Small, explicit PyTorch primitives shared by the scratch tutorials"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]
pretrained = ["transformers>=5.15,<5.16", "huggingface-hub>=1.27,<2", "safetensors>=0.8", "Pillow>=12", "torchvision>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
